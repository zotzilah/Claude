<style>
/* Layout: a phone running the app sits on a royal-blue "shop counter"; prototype notes sit beside it (stacked on phones).
   Single look by choice: a glossy white catalogue page, the same in light and dark hosts. */
:root {
  color-scheme: light;
  --red: #d8141c;
  --red-deep: #a80d14;
  --blue: #0b3c9c;
  --blue-deep: #072a6e;
  --yellow: #ffd200;
  --paper: #ffffff;
  --paper-2: #f3f5fa;
  --ink: #15161a;
  --ink-soft: #4a4f5c;
  --rule: #d9deea;
  --biro: #1d3fc4;
  --good: #11804a;
  --slip: #fbfaf4;

  --f-display: "Archivo Black", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Archivo Narrow", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  --f-hand: "Gochi Hand", "Comic Sans MS", "Marker Felt", cursive;
  --f-till: "Courier Prime", "Courier New", Courier, monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--blue-deep);
  background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
  background-size: 14px 14px;
  color: var(--paper);
  font-family: var(--f-body);
  font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

/* ---------- Top bar ---------- */
.top { max-width: 1060px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-size: 26px; letter-spacing: .5px; margin: 0; color: var(--paper); }
.brand h1 span { color: var(--yellow); }
.brand p { margin: 0; color: #b9c8ee; font-size: 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.tab { background: transparent; border: 2px solid rgba(255,255,255,.35); color: var(--paper); border-radius: 999px; padding: 6px 14px; font-weight: 700; letter-spacing: .3px; }
.tab[aria-selected="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.mute { background: var(--red); border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 700; color: var(--paper); }

/* ---------- Layout ---------- */
.layout { max-width: 1060px; margin: 0 auto; display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr); justify-items: center; } .notes { max-width: 420px; } }

.phone { width: 400px; max-width: 100%; height: 780px; background: #0d0f14; border-radius: 46px; padding: 12px; box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 0 0 2px #2a2e38; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: var(--paper); color: var(--ink); display: flex; flex-direction: column; }
@media (max-width: 460px) {
  .phone { height: 740px; border-radius: 30px; padding: 6px; }
  .screen { border-radius: 25px; }
}

.notes { color: #dfe6fb; }
.notes h2 { font-family: var(--f-display); font-size: 30px; line-height: 1.05; color: var(--paper); margin: 4px 0 6px; text-wrap: balance; }
.notes .kicker { display: inline-block; background: var(--red); color: var(--paper); font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; font-size: 12px; padding: 3px 8px; }
.notes p { font-size: 17px; line-height: 1.5; max-width: 60ch; }
.notes ul { padding-left: 20px; margin: 0; display: grid; gap: 8px; font-size: 16px; line-height: 1.45; max-width: 60ch; }
.notes li::marker { color: var(--yellow); }
.notes .try { margin-top: 18px; background: rgba(255,255,255,.08); border-left: 4px solid var(--yellow); padding: 10px 14px; font-size: 15px; }
.notes .try b { color: var(--yellow); }
.disclaim { margin-top: 18px; font-size: 13px; color: #9fb0dc; }

/* ---------- Status bar (inside phone) ---------- */
.status { flex: none; height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 26px; font-size: 13px; font-weight: 700; background: var(--red); color: var(--paper); }
.status.s-kid { background: var(--yellow); color: var(--ink); }
.status.s-web { background: var(--paper-2); color: var(--ink); }
.status.s-till { background: var(--blue-deep); }

/* ---------- Catalogue ---------- */
.cat-head { flex: none; background: var(--red); color: var(--paper); padding: 6px 16px 12px; position: relative; }
.cat-head .book { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; opacity: .9; display: flex; justify-content: space-between; gap: 8px; }
.cat-head h3 { font-family: var(--f-display); font-size: 27px; line-height: 1; margin: 6px 0 0; letter-spacing: .2px; }
.pg { position: absolute; right: 0; bottom: -14px; background: var(--yellow); color: var(--ink); font-family: var(--f-display); font-size: 13px; padding: 4px 10px 4px 12px; border-radius: 6px 0 0 6px; z-index: 3; }
.kidchip { background: var(--ink); color: var(--yellow); border-radius: 4px; padding: 1px 6px; letter-spacing: .6px; }

.stage { position: relative; flex: 1; perspective: 1400px; touch-action: pan-y; overflow: hidden; background: var(--paper-2); }
.page { position: absolute; inset: 0; background: var(--paper); padding: 22px 14px 14px; overflow-y: auto; transform-origin: left center; backface-visibility: hidden; }
.page.flip { pointer-events: none; z-index: 5; box-shadow: 8px 0 24px rgba(0,0,0,.25); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 14px; }

.card { position: relative; display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: none; border: 0; padding: 6px 6px 8px; border-radius: 4px; }
.card .photo { width: 100%; aspect-ratio: 1 / .82; max-width: 100%; display: grid; place-items: center; background: var(--paper); border: 1px solid var(--rule); font-size: 54px; line-height: 1; }
.card .cno { font-family: var(--f-display); font-size: 12.5px; margin-top: 6px; letter-spacing: .4px; color: var(--blue); font-variant-numeric: tabular-nums; }
.card .name { font-size: 14px; line-height: 1.15; font-weight: 600; margin-top: 2px; min-height: 2.3em; }
.card .shop { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
.sticker { position: absolute; right: 2px; top: 52%; transform: rotate(-8deg); background: var(--yellow); color: var(--red-deep); font-family: var(--f-display); font-size: 16px; padding: 7px 8px 6px; line-height: 1; clip-path: polygon(50% 0, 61% 12%, 77% 6%, 80% 22%, 96% 26%, 89% 41%, 100% 54%, 87% 64%, 92% 81%, 75% 82%, 66% 98%, 52% 88%, 37% 100%, 30% 84%, 12% 88%, 14% 71%, 0 61%, 11% 48%, 3% 33%, 19% 27%, 21% 10%, 37% 13%); }
.sticker small { font-size: 11px; vertical-align: top; }
.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.ring path { fill: none; stroke: var(--biro); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.stars { position: absolute; left: 4px; top: -8px; font-family: var(--f-hand); color: var(--biro); font-size: 26px; line-height: 1; transform: rotate(-9deg); pointer-events: none; letter-spacing: -2px; }

.pager { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px; background: var(--paper); border-top: 1px solid var(--rule); }
.pager button { background: var(--blue); color: var(--paper); border: 0; border-radius: 999px; width: 40px; height: 40px; font-size: 18px; font-weight: 700; }
.pager button:disabled { opacity: .3; cursor: default; }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
.dots i.on { background: var(--red); }
.hint { font-family: var(--f-hand); color: var(--biro); font-size: 17px; text-align: center; }

.total { flex: none; background: var(--blue); color: var(--paper); padding: 10px 16px 14px; }
.total .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.total .lbl { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; opacity: .85; }
.total .amt { font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: rgba(255,255,255,.2); border-radius: 4px; margin-top: 6px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--yellow); border-radius: 4px; transition: width .3s; }
.total.over { background: var(--red); }
.total.over .bar b { background: var(--paper); }
.total .msg { font-size: 13px; margin-top: 5px; }

.sendbar { flex: none; padding: 10px 14px 14px; background: var(--paper); border-top: 1px solid var(--rule); display: flex; gap: 8px; }
.big { flex: 1; border: 0; border-radius: 16px; font-family: var(--f-display); font-size: 19px; padding: 14px 10px; background: var(--red); color: var(--paper); box-shadow: 0 4px 0 var(--red-deep); }
.big:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--red-deep); }
.big.alt { flex: none; background: var(--yellow); color: var(--ink); box-shadow: 0 4px 0 #c9a400; font-size: 15px; padding: 14px 14px; }

/* ---------- Kid mode home ---------- */
.kid { flex: 1; overflow-y: auto; background: var(--yellow); padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.kid-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kid h3 { font-family: var(--f-display); font-size: 30px; line-height: 1; margin: 0; color: var(--ink); text-wrap: balance; }
.grownup { background: var(--ink); color: var(--yellow); border: 0; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; flex: none; }
.mic-wrap { display: grid; justify-items: center; gap: 8px; padding: 6px 0; }
.mic { position: relative; width: 132px; height: 132px; border-radius: 50%; border: 0; background: var(--red); box-shadow: 0 6px 0 var(--red-deep); display: grid; place-items: center; }
.mic svg { width: 58px; height: 58px; }
.mic.listening::before, .mic.listening::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 4px solid var(--red); animation: pulse 1.2s ease-out infinite; }
.mic.listening::after { animation-delay: .6s; }
@keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(1.45); opacity: 0; } }
.mic-label { font-family: var(--f-display); font-size: 18px; color: var(--ink); }
.heard { font-family: var(--f-hand); font-size: 30px; color: var(--biro); text-align: center; margin: -4px 0 0; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 12px 8px 10px; display: grid; justify-items: center; gap: 4px; box-shadow: 0 4px 0 var(--ink); }
.tile span { font-size: 50px; line-height: 1; }
.tile b { font-family: var(--f-display); font-size: 20px; color: var(--ink); }
.results { background: var(--paper); border-radius: 18px; padding: 14px 10px 10px; }
.results .grid { grid-template-columns: 1fr 1fr; }
.demo { font-size: 12px; color: var(--ink-soft); text-align: center; }

.pin { position: absolute; inset: 0; background: rgba(7,42,110,.94); color: var(--paper); display: grid; place-content: center; justify-items: center; gap: 14px; z-index: 20; padding: 20px; }
.pin h4 { font-family: var(--f-display); font-size: 22px; margin: 0; text-align: center; }
.pin .pdots { display: flex; gap: 12px; }
.pin .pdots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--paper); }
.pin .pdots i.f { background: var(--yellow); border-color: var(--yellow); }
.pin .pdots.err { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.keys { display: grid; grid-template-columns: repeat(3, 64px); gap: 10px; }
.keys button { height: 56px; border-radius: 14px; border: 0; background: rgba(255,255,255,.15); font-family: var(--f-display); font-size: 22px; }
.pin small { color: #b9c8ee; }

/* ---------- Order slip ---------- */
.till { flex: 1; background: var(--blue-deep); display: flex; flex-direction: column; align-items: center; padding: 18px 16px 16px; overflow: hidden; }
.till-top { width: 100%; background: #20242e; border-radius: 14px 14px 4px 4px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: inset 0 -4px 0 #111; position: relative; z-index: 2; }
.till-top .lcd { font-family: var(--f-till); background: #9fd36b; color: #17310a; padding: 3px 10px; border-radius: 4px; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.till-top span { color: #cfd6e6; font-weight: 700; font-size: 13px; letter-spacing: 1px; }
.slot { width: 86%; height: 8px; background: #000; border-radius: 0 0 6px 6px; position: relative; z-index: 2; }
.receipt-wrap { width: 82%; flex: 1; overflow: hidden; position: relative; margin-top: -4px; }
.receipt { background: var(--slip); color: #222; font-family: var(--f-till); font-size: 13.5px; line-height: 1.35; padding: 16px 14px 18px; position: relative; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); max-height: 100%; overflow-y: auto; }
.receipt.print { animation: printout 2.4s steps(16) both; }
@keyframes printout { from { transform: translateY(-100%); } to { transform: translateY(0); } }
.receipt h4 { font-family: var(--f-display); font-size: 18px; text-align: center; margin: 0; letter-spacing: 1px; color: var(--red); }
.receipt .c { text-align: center; }
.receipt hr { border: 0; border-top: 2px dashed #9aa0aa; margin: 8px 0; }
.receipt .ln { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 6px; font-variant-numeric: tabular-nums; }
.receipt .ln .st { color: var(--biro); font-family: var(--f-hand); font-size: 17px; line-height: 1; }
.receipt .tot { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; }
.queue { margin-top: 8px; border: 3px solid var(--ink); text-align: center; padding: 8px 6px; }
.queue b { display: block; font-family: var(--f-display); font-size: 40px; line-height: 1; color: var(--red); }
.emailed { margin-top: 10px; text-align: center; color: var(--good); font-weight: 700; }
.till-actions { width: 100%; display: flex; gap: 8px; margin-top: 12px; }

/* ---------- Giver web link ---------- */
.web { flex: 1; overflow-y: auto; background: var(--paper-2); }
.url { margin: 8px 12px; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 7px 12px; font-size: 13px; color: var(--ink-soft); display: flex; gap: 6px; align-items: center; }
.g-head { background: var(--blue); color: var(--paper); padding: 14px 16px; }
.g-head h3 { font-family: var(--f-display); font-size: 23px; line-height: 1.05; margin: 0; text-wrap: balance; }
.g-head p { margin: 4px 0 0; font-size: 14px; opacity: .9; }
.surprise { margin: 10px 12px 0; background: var(--yellow); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; font-weight: 600; }
.sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 10px 12px; }
.sum div { background: var(--paper); border-radius: 10px; padding: 8px 10px; border: 1px solid var(--rule); }
.sum b { display: block; font-family: var(--f-display); font-size: 17px; font-variant-numeric: tabular-nums; }
.sum span { font-size: 12px; color: var(--ink-soft); }
.items { display: grid; gap: 10px; margin: 0 12px 16px; }
.item { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 4px 10px; }
.item .th { grid-row: span 2; width: 58px; height: 58px; display: grid; place-items: center; font-size: 34px; border: 1px solid var(--rule); border-radius: 8px; }
.item .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; min-width: 0; }
.item .t b { font-weight: 700; font-size: 15px; line-height: 1.2; }
.item .t .p { font-family: var(--f-display); font-size: 15px; color: var(--red); white-space: nowrap; }
.item .meta { font-size: 12.5px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.item .meta .st { color: var(--biro); font-family: var(--f-hand); font-size: 18px; line-height: 1; }
.item .meta .lnk { color: var(--blue); font-weight: 700; text-decoration: underline; }
.item .act { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
.pill { font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 4px 10px; }
.pill.held { background: #fff3c2; color: #6b5200; }
.pill.bought { background: #dff3e8; color: var(--good); }
.btn { border: 0; border-radius: 8px; padding: 7px 12px; font-weight: 700; font-size: 13.5px; background: var(--blue); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--blue); border: 2px solid var(--blue); padding: 5px 10px; }
.btn.go { background: var(--good); }
.gg { grid-column: 1 / -1; background: var(--paper-2); border-radius: 8px; padding: 8px 10px; margin-top: 4px; font-size: 13px; }
.gg .bar { background: var(--rule); }
.gg .bar b { background: var(--good); }
.gg .who { color: var(--ink-soft); margin-top: 4px; }
.sharebar { position: sticky; bottom: 0; background: var(--paper); border-top: 1px solid var(--rule); padding: 10px 12px 12px; display: flex; gap: 8px; }
.sharebar .btn { flex: 1; padding: 10px; }
.wa { background: #1a8f4c; }

.toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 10px; font-size: 13.5px; width: max-content; max-width: 86%; text-align: center; z-index: 30; }

@media (prefers-reduced-motion: reduce) {
  .receipt.print, .mic.listening::before, .mic.listening::after, .pin .pdots.err { animation: none; }
  .bar b { transition: none; }
}
</style>

<header class="top">
  <div class="brand">
    <h1>PROJECT <span>BIRO</span></h1>

</header>

      'The running total tracks the budget and goes red when it\'s over. It is a per-list toggle, off by default for weddings.',
    ], 'Turn to <b>Outdoor Fun</b> and circle the scooter. Watch the total go red.'],
    kid: ['Kid Mode', 'Handed over on the parent\'s phone, locked down', [
      'Search and circle only. No prices to tap, no shop links, no settings.',
      'Voice search first: a giant mic for kids who can\'t spell "Playmobil" yet.',
      'Picture tiles with one big word each. Tapping one opens that catalogue page in Kid Mode.',
      'A parent PIN (or Face ID) is the only way out.',
    ], 'Tap the <b>mic</b>, then try <b>🔒 Grown-ups</b> with PIN 1234.'],
    slip: ['The "done" moment', 'Send to Mum & Dad', [
      'Cash register clunk, ding and receipt-printer chatter as the slip prints.',
      'The slip lists catalogue numbers, stars and prices, with the total on the till display.',
      '"Your number is 47. Please wait for Christmas."',
      'A copy is emailed to the account holder as a confirmation receipt.',
    ], 'Turn the sound on and press <b>Print again</b>.'],
    giver: ['The Giver link', 'Nan, Dave and Auntie Sue, with no download', [
      'Opens in any browser from WhatsApp, a text or a QR code.',
      'Claim holds an item for 48 hours. Then it\'s "I\'ve bought it" (honour system) or it goes back on the list.',
      'Surprise mode hides who bought what from Ellie and the list owner.',
      'Group gifts: one organiser buys and collects money directly. The app only tracks pledges.',
    ], '<b>Claim</b> the paint set, then mark it bought. <b>Pledge</b> towards the bike.'],
  };
  function renderNotes() {
    const [h, k, list, tryIt] = NOTES[S.screen];
    $('#notes').innerHTML = `<span class="kicker">${k}</span><h2>${h}</h2>
      <ul>${list.map(l => `<li>${l}</li>`).join('')}</ul>
      <div class="try"><b>Try it:</b> ${tryIt}</div>
      <p class="disclaim">All products, prices and shops here are made-up examples. Real lists use live retailer prices and link out to the seller.</p>`;
  }

  // ---------- Routing ----------
  const RENDER = { catalogue: renderCatalogue, kid: renderKid, slip: renderSlip, giver: renderGiver };
  function go(name, fromTab) {
    if (!RENDER[name]) name = 'catalogue';
    if (name === 'kid') S.kid = true;
    if (fromTab && name !== 'kid' && name !== 'catalogue') S.pin = null;
    if (fromTab && name === 'catalogue') S.kid = false;
    S.screen = name;
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.go === name)));
    RENDER[name]();
    renderNotes();
    if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  }

  document.addEventListener('click', e => {
    const card = e.target.closest('.card[data-id]');
    if (card) { if (swiped) { swiped = false; return; } onCard(card); return; }
    const g = e.target.closest('[data-go]');
    if (g) go(g.dataset.go, g.classList.contains('tab'));
  });
  $('#mute').onclick = () => {
    S.muted = !S.muted;
    $('#mute').textContent = S.muted ? '🔇 Sound off' : '🔊 Sound on';
    $('#mute').setAttribute('aria-pressed', String(S.muted));
  };
  addEventListener('resize', () => drawRings(screen));
  addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.screen) go(h, true); });

  go(location.hash.slice(1) || 'catalogue', true);
})();
</script>
